name: schedule-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx beautifulsoup4 pillow

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP: ${{ vars.GROUP }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          ADMIN_USERNAMES: ${{ vars.ADMIN_USERNAMES }}
          ADMIN_IDS: ${{ vars.ADMIN_IDS }}
        run: python bot.py

      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }}
